<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Login do CD</title>
  <style>
    body {
      background-color: #2f2f2f;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background-color: #fff;
      color: #000;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 500px;
      margin-bottom: 2rem;
    }

    h2 {
      color: #b30000;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: bold;
      margin-top: 1rem;
      display: block;
    }

    input {
      width: 100%;
      padding: 0.7rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    input.uppercase {
      text-transform: uppercase;
    }

    button {
      margin-top: 2rem;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 0.8rem;
      width: 100%;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    table {
      width: 100%;
      max-width: 800px;
      background-color: #fff;
      color: #000;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    th, td {
      padding: 0.8rem;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #b30000;
      color: white;
    }

    td {
      font-size: 0.95rem;
    }

    .table-wrapper {
      width: 100%;
      max-width: 800px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Cadastro de Login do CD</h2>

    <label for="cd">Nome do CD:</label>
    <input type="text" id="cd" class="uppercase" placeholder="Digite o nome do CD" required />

    <label for="login">Login:</label>
    <input type="text" id="login" class="uppercase" placeholder="Digite o login" required />

    <label for="senha">Senha de Acesso:</label>
    <input type="text" id="senha" maxlength="10" placeholder="Somente números" required />

    <button onclick="cadastrar()">Cadastrar</button>
  </div>

  <div class="table-wrapper">
    <table id="tabelaCDs">
      <thead>
        <tr>
          <th>Nome do CD</th>
          <th>Login</th>
          <th>Senha</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" style="text-align: center;">Nenhum cadastro ainda</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const tabela = document.getElementById("tabelaCDs").querySelector("tbody");

    document.getElementById('senha').addEventListener('input', function (e) {
      this.value = this.value.replace(/\D/g, '');
    });

    function cadastrar() {
      const cdInput = document.getElementById('cd');
      const loginInput = document.getElementById('login');
      const senhaInput = document.getElementById('senha');

      const cd = cdInput.value.trim().toUpperCase();
      const login = loginInput.value.trim().toUpperCase();
      const senha = senhaInput.value.trim();

      if (!cd || !login || !senha) {
        alert("Preencha todos os campos.");
        return;
      }

      // Adiciona linha na tabela
      if (tabela.children[0].children.length === 1 && tabela.children[0].children[0].colSpan === 3) {
        tabela.innerHTML = ''; // remove a linha "Nenhum cadastro ainda"
      }

      const linha = document.createElement('tr');
      linha.innerHTML = `<td>${cd}</td><td>${login}</td><td>${senha}</td>`;
      tabela.appendChild(linha);

      // Limpa os campos
      cdInput.value = '';
      loginInput.value = '';
      senhaInput.value = '';

      alert("Cadastro realizado com sucesso!");
    }
  </script>
</body>
</html>
